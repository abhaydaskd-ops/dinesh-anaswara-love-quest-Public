<!DOCTYPE html>
<html>
<head>
    <title>Dinesh ❤️ Anaswara - Moonlight Promise</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2b5876, #4e4376);
            color: white;
            text-align: center;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 20px;
            margin-top: 60px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        #timer {
            font-size: 18px;
            color: #ffd369;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255,255,255,0.08);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
        }

        button {
            padding: 12px 22px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #ff7eb3;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background: #ff4e8a;
            transform: scale(1.05);
        }

        .hidden {
            display: none;
        }

        .final {
            font-size: 22px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🌙 Moonlight Promise 🌙</h1>
    <h2>Dinesh ❤️ Anaswara</h2>

    <div id="timer">Time for Dinesh & Anaswara: 75s</div>

    <div class="card" id="game">
        <p id="question"></p>
        <div id="answers"></div>
    </div>

    <div class="card hidden" id="result">
        <p class="final">
            ✨ Under every moon and beyond every sunrise,<br><br>
            Anaswara chooses Dinesh — today, tomorrow, always. ❤️<br><br>
            Promise sealed forever. 🌙
        </p>
    </div>
</div>

<script>

let questions = [
    {
        question: "What makes Dinesh feel lucky every single day?",
        options: ["Good food", "Anaswara’s smile", "Rainy evenings", "Movies"],
        answer: "Anaswara’s smile"
    },
    {
        question: "If their love was a season, it would be:",
        options: ["Winter", "Summer", "Forever Spring", "Autumn"],
        answer: "Forever Spring"
    },
    {
        question: "What is Dinesh’s safest place?",
        options: ["Home", "His room", "Anaswara’s heart", "Beach"],
        answer: "Anaswara’s heart"
    },
    {
        question: "What is stronger than distance?",
        options: ["Time", "Memory", "Dinesh & Anaswara", "Dreams"],
        answer: "Dinesh & Anaswara"
    },
    {
        question: "Final Promise: Does Anaswara stay with Dinesh forever?",
        options: ["Yes ❤️", "Always ❤️", "Forever ❤️", "Endlessly ❤️"],
        answer: "Forever ❤️"
    }
];

let currentQuestion = 0;
let timeLeft = 75;
let timerElement = document.getElementById("timer");

function startTimer() {
    let countdown = setInterval(function() {
        timeLeft--;
        timerElement.innerHTML = "Time for Dinesh & Anaswara: " + timeLeft + "s";
        if(timeLeft <= 0) {
            clearInterval(countdown);
            alert("Time ended... but their story never does ❤️");
        }
    }, 1000);
}

function loadQuestion() {
    if(currentQuestion >= questions.length) {
        document.getElementById("game").classList.add("hidden");
        document.getElementById("result").classList.remove("hidden");
        return;
    }

    let q = questions[currentQuestion];
    document.getElementById("question").innerText = q.question;
    let answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.options.forEach(option => {
        let btn = document.createElement("button");
        btn.innerText = option;
        btn.onclick = function() {
            if(option === q.answer) {
                currentQuestion++;
                loadQuestion();
            } else {
                alert("That’s not the right answer 😉 Try again!");
            }
        };
        answersDiv.appendChild(btn);
    });
}

startTimer();
loadQuestion();

</script>

</body>
</html>
